<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc"><title id="title">An evidence-led coding loop</title><desc id="desc">Build, verify, inspect, repair. Human review is required for visual baselines.</desc><rect width="1200" height="160" rx="20" fill="#101426"/><g font-family="Arial,sans-serif"><g font-size="20" font-weight="700"><text x="45" y="66" fill="#a78bfa">01 · BUILD</text><text x="345" y="66" fill="#45d4df">02 · VERIFY</text><text x="645" y="66" fill="#ffbf69">03 · INSPECT</text><text x="945" y="66" fill="#64dba6">04 · REPAIR</text></g><g font-size="16" fill="#d8deed"><text x="45" y="101">Your app + expectations</text><text x="345" y="101">CLI or SDK checks</text><text x="645" y="101">Reports + human review</text><text x="945" y="101">Fix, rerun, retain evidence</text></g></g></svg>