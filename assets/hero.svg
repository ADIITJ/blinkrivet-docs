      <tspan fill="#6ce8ec">.</tspan>
    </text>
    <text x="54" y="197" fill="url(#accent)" font-size="29" font-weight="650">
      Tiny screens. Serious evidence.
    </text>
    <text x="54" y="238" fill="#b8c6df" font-size="18">
      Catch focus traps, visual drift and broken states.
    </text>
    <text x="54" y="267" fill="#b8c6df" font-size="18">
      Run locally. Review the pixels. Keep the proof.
    </text>
    <g font-size="13" font-weight="700">
