        x="54"
        y="302"
        width="102"
        height="31"
        rx="8"
        fill="#113c40"
        stroke="#3dcfc5"
      />
      <text x="105" y="322" text-anchor="middle" fill="#8cf4e6">SDK + CLI</text>
      <rect
        x="168"
        y="302"
        width="128"
        height="31"
        rx="8"
        fill="#30254f"
        stroke="#a78bfa"
      />
      <text x="232" y="322" text-anchor="middle" fill="#ddcaff">
        PLAYWRIGHT
      </text>
      <rect
        x="308"
        y="302"
        width="117"
        height="31"
        rx="8"
        fill="#413320"
        stroke="#e3ad51"
