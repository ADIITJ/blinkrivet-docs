      <text x="65" y="259" fill="#bac9df" font-size="14">Browse cues</text>
      <g transform="translate(291 78)" font-family="monospace" font-size="13">
        <text y="0" fill="#bba1ff">ASSERT &amp; INSPECT</text>
        <text y="41" fill="#76ead4">↳ focus traversal</text>
        <text y="74" fill="#76ead4">↳ visual regions</text>
        <text y="107" fill="#76ead4">↳ offline recovery</text>
        <text y="140" fill="#76ead4">↳ resource limits</text>
        <text y="181" fill="#f0c77d">review → accept</text>
        <text y="210" fill="#95aac9">baseline policy</text>
      </g>
      <path d="M28 328H523" stroke="#2b3853" />
      <g font-size="12" font-weight="700" text-anchor="middle">
        <rect x="28" y="348" width="102" height="32" rx="8" fill="#282140" />
        <text x="79" y="369" fill="#d2b6ff">JSON</text>
        <rect x="142" y="348" width="102" height="32" rx="8" fill="#153440" />
        <text x="193" y="369" fill="#82dfed">JUnit</text>
        <rect x="256" y="348" width="102" height="32" rx="8" fill="#3e2d34" />
        <text x="307" y="369" fill="#ffb4ba">HTML</text>
        <rect x="370" y="348" width="153" height="32" rx="8" fill="#35321e" />
        <text x="446" y="369" fill="#f5d988">PNG + DIFF</text>
