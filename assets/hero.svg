      <rect x="1" y="1" width="549" height="39" rx="19" fill="#1d2640" />
      <path d="M1 21H550V40H1Z" fill="#1d2640" />
      <circle cx="23" cy="21" r="5" fill="#ff859f" />
      <circle cx="41" cy="21" r="5" fill="#f5cf75" />
      <circle cx="59" cy="21" r="5" fill="#6ce4b0" />
      <text x="276" y="26" text-anchor="middle" fill="#a6b9d8" font-size="12">
