<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1280"
  height="540"
  viewBox="0 0 1280 540"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">
    Blinkrivet — tiny screens, serious regression evidence
  </title>
  <desc id="desc">
    A purple and cyan illustration of a wearable display beside a terminal.
    Local CLI, reviewed baselines, JSON, JUnit and HTML evidence. Decorative
    illustration, not a test result.
  </desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#12152f" />
      <stop offset="1" stop-color="#071f2d" />
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#c4a0ff" />
      <stop offset="1" stop-color="#64e5f3" />
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7c3aed" stop-opacity=".32" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b6d2ff" stroke-opacity=".045" />
    </pattern>
  </defs>
  <rect width="1280" height="540" rx="24" fill="url(#bg)" />
  <rect width="1280" height="540" rx="24" fill="url(#grid)" />
  <ellipse cx="340" cy="140" rx="440" ry="290" fill="url(#glow)" />
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <rect
      x="52"
      y="43"
      width="186"
      height="28"
      rx="14"
      fill="#292044"
      stroke="#8c63d2"
    />
    <text
      x="145"
      y="62"
      text-anchor="middle"
      fill="#dfcaff"
      font-size="12"
